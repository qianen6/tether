name: release

# A `v*` tag builds every installer and publishes them as a GitHub Release.
# Run by hand (Actions → release → Run workflow) to only build them, as
# downloadable artifacts of the run.
#
# Optional settings (Settings → Secrets and variables → Actions):
# - variable WINDOWS_SIGN_COMMAND: signs the Windows programs and installers,
#   given to Tauri as `bundle.windows.signCommand` (`%1` is the file), e.g. a
#   signtool call or a signing service's client.
# - variables EXPO_OWNER and EAS_PROJECT_ID, secret EXPO_TOKEN: also build the
#   Android app on EAS and attach it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, vendor: windows-amd64, name: windows-x64 }
          - { os: macos-latest, target: aarch64-apple-darwin, vendor: darwin-arm64, name: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, vendor: darwin-amd64, name: macos-x64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, vendor: linux-amd64, name: linux-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Also the phone packages pnpm installs from vendor/.
      - name: TailPocket files
        run: scripts/fetch-vendor.sh ${{ matrix.vendor }}
      - run: pnpm install --frozen-lockfile

      - name: Signing
        if: runner.os == 'Windows' && vars.WINDOWS_SIGN_COMMAND != ''
        env:
          SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND }}
        run: |
          jq -n --arg c "$SIGN_COMMAND" '{bundle: {windows: {signCommand: $c}}}' > "$RUNNER_TEMP/sign.json"
          echo "SIGN_CONFIG=$RUNNER_TEMP/sign.json" >> "$GITHUB_ENV"

      - name: Desktop installers
        run: scripts/package-desktop.sh --target ${{ matrix.target }} ${SIGN_CONFIG:+--config "$SIGN_CONFIG"}

      - name: Command line
        run: |
          . scripts/release-rustflags.sh
          cargo build --release --locked -p tether --target ${{ matrix.target }}

      - name: Collect
        run: |
          set -eu
          out="target/${{ matrix.target }}/release"
          mkdir -p dist cli
          for f in "$out"/bundle/nsis/*.exe "$out"/bundle/msi/*.msi "$out"/bundle/dmg/*.dmg \
                   "$out"/bundle/appimage/*.AppImage "$out"/bundle/deb/*.deb; do
            if [ -f "$f" ]; then cp "$f" dist/; fi
          done
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=".exe"
          cp "$out/tether$ext" cli/
          cp "vendor/tailpocket/bin/tailpocket-host-${{ matrix.vendor }}$ext" "cli/tailpocket-host$ext"
          cp LICENSE NOTICE cli/
          if [ "${{ runner.os }}" = Windows ]; then
            (cd cli && 7z a -tzip "../dist/tether-cli-${{ matrix.name }}.zip" . >/dev/null)
          else
            tar -czf "dist/tether-cli-${{ matrix.name }}.tar.gz" -C cli .
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  android:
    if: vars.EAS_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: scripts/fetch-vendor.sh mobile
      - run: pnpm install --frozen-lockfile
      - name: Link the Expo project
        working-directory: apps/mobile-debug
        env:
          OWNER: ${{ vars.EXPO_OWNER }}
          PROJECT: ${{ vars.EAS_PROJECT_ID }}
        run: |
          jq --arg o "$OWNER" --arg p "$PROJECT" \
            '.expo.owner = $o | .expo.extra.eas.projectId = $p' app.json > app.linked.json
          mv app.linked.json app.json
      - name: Build on EAS
        working-directory: apps/mobile-debug
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli build -p android --profile preview --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
          url=$(jq -r '.[0].artifacts.applicationArchiveUrl' "$RUNNER_TEMP/build.json")
          mkdir -p "$GITHUB_WORKSPACE/dist"
          curl -fL --retry 5 -o "$GITHUB_WORKSPACE/dist/tether-android.apk" "$url"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  release:
    needs: [desktop, android]
    # The Android build is optional: skipped is fine, failed is not.
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && needs.desktop.result == 'success'
      && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        env:
          SIGNED: ${{ vars.WINDOWS_SIGN_COMMAND != '' }}
        run: |
          set -eu
          (cd dist && sha256sum * > SHA256SUMS)
          if [ "$SIGNED" = true ]; then
            signing='Windows 版已签名。macOS 版未签名：第一次打开如果提示"无法验证开发者"，到"系统设置 → 隐私与安全性"里点"仍要打开"。'
          else
            signing='安装包还没有代码签名：
          - Windows 弹出"Windows 已保护你的电脑"时，点"更多信息"→"仍要运行"。如果是"智能应用控制已阻止"，没有放行按钮，只能在"Windows 安全中心 → 应用和浏览器控制 → 智能应用控制"里关掉它后再装（较早的 Windows 11 版本关掉后要重置系统才能再打开）。
          - macOS 提示"无法验证开发者"时，到"系统设置 → 隐私与安全性"里点"仍要打开"。
          - 可以用 SHA256SUMS 核对下载的文件。'
          fi
          VERSION="${GITHUB_REF_NAME}" SIGNING="$signing" python3 - <<'EOF'
          import os
          text = open("scripts/release-notes.md", encoding="utf-8").read()
          text = text.replace("{{VERSION}}", os.environ["VERSION"]).replace("{{SIGNING}}", os.environ["SIGNING"])
          open("notes.md", "w", encoding="utf-8").write(text)
          EOF
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Tether $GITHUB_REF_NAME" --notes-file notes.md $pre
